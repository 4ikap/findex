[project]
name = "findex"
version = "0.4.0"
description = "Інвертований індекс і ранжований пошук (TF-IDF / BM25) з CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.7",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: тест довший за ~1 секунду (пропустити: pytest -m 'not slow')",
]

[tool.coverage.run]
source = ["findex"]
branch = true
omit = [
    "*/findex/benchmark.py",
    "*/findex/stats.py",
    "*/findex/greedy_stats.py",
    "*/findex/__main__.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
